# Release pipeline — triggered by `bun run tauri:release`, which computes
# the next version, tags `vX.Y.Z`, and pushes the tag. No version-bump commit
# is pushed to `main`, so a fork's `main` stays a clean fast-forward of
# upstream.
#
# The committed version files (`package.json`, `src-tauri/Cargo.toml`,
# `src-tauri/Cargo.lock`) are stamped from the tag *on the runner* by
# `scripts/stamp-version.ts` before the build, so `CARGO_PKG_VERSION` and the
# reported app version always equal the tag without any committed bump.
#
# Builds bundles for macOS (universal), Windows, and Linux, signs the updater
# artifacts, and publishes everything (installers + latest.json) to a DRAFT
# GitHub release. Publish the draft manually — the moment it goes live,
# installed apps see it via releases/latest/download/latest.json.
#
# The release env config (URLs, updater pubkey, branding) is intentionally
# NOT committed. It lives in the RELEASE_ENV secret and is written to `.env`
# on the runner; VITE_APP_VERSION is then stamped from the tag, so the secret
# is set once and never goes stale:
#
#   gh secret set RELEASE_ENV < .env
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   RELEASE_ENV                        — full contents of the release .env
#   TAURI_SIGNING_PRIVATE_KEY          — minisign private key matching
#                                        VITE_UPDATER_PUBKEY in RELEASE_ENV
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — its password (may be empty)
#
# Optional repository secrets (macOS Developer ID signing + notarization):
#   APPLE_CERTIFICATE                  — base64 of a Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD         — password for that .p12
#   APPLE_SIGNING_IDENTITY             — e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_API_ISSUER                   — App Store Connect Issuer ID (UUID)
#   APPLE_API_KEY                      — App Store Connect Key ID (10 characters)
#   APPLE_API_KEY_P8                   — base64 of the downloaded AuthKey_<KeyID>.p8
#
# These six are all-or-nothing: set all of them to sign + notarize the macOS
# bundle, or leave all unset to keep producing an unsigned build (the default
# for forks without an Apple Developer Program membership). See
# .hermes/plans/macos-codesign-notarization/PLAN.md and
# https://v2.tauri.app/distribute/sign/macos/ for setup details.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Materialize .env from RELEASE_ENV secret
        shell: bash
        env:
          RELEASE_ENV: ${{ secrets.RELEASE_ENV }}
        run: |
          if [ -z "$RELEASE_ENV" ]; then
            echo "::error::RELEASE_ENV secret is not set. Create it with: gh secret set RELEASE_ENV < .env" >&2
            exit 1
          fi
          printf '%s\n' "$RELEASE_ENV" > .env

          pubkey=$(grep -E '^VITE_UPDATER_PUBKEY=' .env | sed -E 's/^VITE_UPDATER_PUBKEY="?([^"]*)"?$/\1/')
          if [ -z "$pubkey" ] || [[ "$pubkey" == *" "* ]]; then
            echo "::error::VITE_UPDATER_PUBKEY in RELEASE_ENV is missing or a placeholder — the updater would be broken." >&2
            exit 1
          fi

          # Stamp the version from the tag so the bundle version always equals
          # the tag, regardless of what the (set-once) secret contains.
          version="${GITHUB_REF_NAME#v}"
          if grep -qE '^VITE_APP_VERSION=' .env; then
            sed -E 's/^VITE_APP_VERSION=.*$/VITE_APP_VERSION="'"$version"'"/' .env > .env.tmp && mv .env.tmp .env
          else
            printf 'VITE_APP_VERSION="%s"\n' "$version" >> .env
          fi

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both targets are needed for the macOS universal binary; ignored elsewhere.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      # The Rust backend bakes VITE_* values in at compile time via option_env!,
      # which reads the process environment — a .env file on disk is NOT enough.
      # Without this, the binary ships with about:blank as the saver URL.
      - name: Export .env to the build environment
        shell: bash
        run: bun run scripts/export-env-to-github.ts

      - name: Verify build environment
        shell: bash
        run: |
          if [ -z "$VITE_SAVER_URL" ]; then
            echo "::error::VITE_SAVER_URL did not reach the build environment — the compiled saver would be blank." >&2
            exit 1
          fi
          echo "VITE_SAVER_URL is set for the compile step."

      - name: Generate Tauri runtime config
        run: bun run scripts/build-tauri-config.ts

      # Stamp the committed version files from the tag *on the runner* so the
      # bundle/CARGO_PKG_VERSION always equals the tag, with no version-bump
      # commit on `main`. Must run after `bun install` and before the build.
      - name: Stamp committed version files from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          bun run scripts/stamp-version.ts "$version"
          echo "Stamped $version into package.json / Cargo.toml / Cargo.lock"

      # Optional macOS Developer ID signing + notarization. The six APPLE_*
      # secrets are all-or-nothing: all set → signed+notarized build; none set
      # → unsigned build exactly as before. Partial configuration fails fast
      # here before the expensive compilation/notarization work starts.
      - name: Check macOS signing configuration
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          required=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                    APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8)
          set_count=0
          missing=()
          for var in "${required[@]}"; do
            if [ -n "${!var}" ]; then
              set_count=$((set_count + 1))
            else
              missing+=("$var")
            fi
          done

          if [ "$set_count" -eq 0 ]; then
            echo "No APPLE_* signing secrets set — building an unsigned macOS bundle (Gatekeeper will warn on install)."
          elif [ "$set_count" -eq "${#required[@]}" ]; then
            echo "All APPLE_* signing secrets present — building a signed + notarized macOS bundle."
          else
            echo "::error::Partial macOS signing configuration — set ALL of ${required[*]}, or none of them. Missing: ${missing[*]}" >&2
            exit 1
          fi

      # Materialize the App Store Connect API .p8 key under $RUNNER_TEMP and
      # export APPLE_API_KEY_PATH for the build step. Only runs when the key
      # secret exists; unconfigured forks skip this with no side effects.
      - name: Materialize App Store Connect API key
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "No App Store Connect API key configured — skipping (unsigned build)."
            exit 0
          fi

          key_dir="$RUNNER_TEMP/appstoreconnect"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          key_path="$key_dir/AuthKey_${APPLE_API_KEY}.p8"

          # `base64 -D` is the macOS spelling; the runner is always macOS here.
          printf '%s' "$APPLE_API_KEY_P8" | base64 -D > "$key_path"
          chmod 600 "$key_path"

          if ! grep -q "BEGIN PRIVATE KEY" "$key_path"; then
            echo "::error::APPLE_API_KEY_P8 did not decode to a PEM private key — re-run: base64 -i AuthKey_XXXX.p8 | pbcopy" >&2
            exit 1
          fi

          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "App Store Connect API key written to \$RUNNER_TEMP (key id ${APPLE_API_KEY})."

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Liminal Screen ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          args: --config src-tauri/.tauri-runtime.conf.json ${{ matrix.args }}

      # Always remove the materialized .p8 from the runner, even if the build
      # or notarization step failed. GitHub-hosted runners wipe $RUNNER_TEMP
      # between jobs, but this protects self-hosted runners too.
      - name: Remove App Store Connect API key
        if: always() && matrix.platform == 'macos-latest'
        shell: bash
        run: rm -rf "$RUNNER_TEMP/appstoreconnect"
